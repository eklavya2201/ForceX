{% extends 'base.html' %}{% block title %}Shared content · ForceX{% endblock %}{% block content %}<link rel="stylesheet" href="{{ url_for('drm_asset',name='universal-drm.css') }}"><section class="card viewer"><div id="drm-viewer" data-kind="{{ kind }}" data-pages="{{ pages }}" data-page-base="{{ url_for('receive.view_page',share_id=share.id,index=0)[:-1] }}" data-video-url="{{ url_for('receive.view_file',share_id=share.id) }}" data-video-type="{{ mime }}" data-watermark="{{ watermark }}" data-status-url="{{ url_for('receive.view_status',share_id=share.id) }}"></div><p>Every page carries a watermark that identifies this share. Copying, saving and printing are disabled.</p><p>Session ends in <strong id="countdown" data-seconds="{{ ttl }}"></strong>.</p><form method="post" action="{{ url_for('receive.end',share_id=share.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Close and destroy</button></form></section><script src="{{ url_for('drm_asset',name='universal-drm.js') }}" defer></script><script src="{{ url_for('static',filename='viewer.js') }}" defer></script>{% endblock %}
