{% extends 'base.html' %}{% block title %}Sign in / ForceX{% endblock %}{% block content %}<section class="card narrow auth-card reveal"><div class="auth-topline"></div><div class="auth-brand eyebrow">Private transfer network</div><h1>Welcome back.</h1><p>Sign in to manage your secure links and transfers.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field">Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label class="field">Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label><button class="auth-submit">Sign in to ForceX <span>↗</span></button></form><p class="auth-foot">New to the network? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>{% endblock %}
