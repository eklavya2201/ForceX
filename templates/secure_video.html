<!DOCTYPE html>
<html>
<head>
<title>ForceX Video Player</title>
<style>
body {
  margin: 0;
  background: black;
}
video {
  width: 100%;
  height: 100vh;
}
.watermark {
  position: fixed;
  top: 40%;
  left: 20%;
  font-size: 32px;
  opacity: 0.25;
  color: white;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="watermark">
  {{ user }} | ForceX | Confidential
</div>

<video controls controlsList="nodownload">
  <source src="{{ video_url }}" type="video/mp4">
</video>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());
</script>

</body>
</html>
